  <div id="grid-view"></div>

  <script>
    const images = document.querySelectorAll("#scatter-view .image");
    const gridView = document.getElementById("grid-view");
    const viewToggle = document.getElementById("view-toggle");
    const viewToggleLabel = document.getElementById("view-toggle-label");

    images.forEach(image => {
      const item = document.createElement("div");
      item.className = "grid-item";

      const gridImage = document.createElement("img");
      gridImage.src = image.src;
      gridImage.alt = "";
      gridImage.loading = "lazy";

      item.appendChild(gridImage);
      gridView.appendChild(item);
    });

    viewToggle.addEventListener("click", () => {
      const isGrid = document.body.classList.toggle("view-grid");
      document.body.classList.toggle("view-scatter", !isGrid);
      viewToggleLabel.textContent = isGrid ? "Explore" : "Grid";
      viewToggle.setAttribute(
        "aria-label",
        isGrid ? "Switch to explore view" : "Switch to grid view"
      );
    });
  
    let globalIndex = 0,
        last = { x: 0, y: 0 };
  
    const activate = (image, x, y) => {
      image.style.left = `${x}px`;
      image.style.top = `${y}px`;
      image.style.zIndex = globalIndex;
  
      image.dataset.status = "active";
      last = { x, y };
    };
  
    const distanceFromLast = (x, y) => {
      return Math.hypot(x - last.x, y - last.y);
    };
  
    const handleOnMove = e => {
  if (distanceFromLast(e.clientX, e.clientY) > (window.innerWidth / 20)) {
    const index = globalIndex % images.length;

    const lead = images[index];
    activate(lead, e.clientX, e.clientY);

    
    for (let i = 0; i < images.length; i++) {
      if ((globalIndex - i + images.length) % images.length >= 4) {
        images[i].dataset.status = "inactive";
      }
    }

    globalIndex++;
  }
};
  
    window.onmousemove = e => handleOnMove(e);
    window.ontouchmove = e => handleOnMove(e.touches[0]);
  </script>
